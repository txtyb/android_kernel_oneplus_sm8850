name: Build full OSS kernel (SM8850 kernel_platform)

# Compiles the complete OnePlus 15 (SM8850 / canoe / infiniti) OSS kernel with
# kleaf, the same way LineageOS 24 / PixelOS 17 do it for this device:
#
#   ./tools/bazel run //vendor/oneplus/kernel:canoe_perf_dist -- --destdir=<dist>
#
# The job assembles the kernel platform (ACK common + kleaf + prebuilts +
# external deps + this SoC repository + sm8850-modules + sm8850-devicetrees) in
# the runner and uploads the resulting Image / dtb.img / dtbo.img / boot.img /
# vendor_dlkm / system_dlkm artifacts - i.e. what device/oneplus/infiniti-kernel
# ships as the "prebuilt kernel".
#
# NOTE: this is heavy (multi-GB downloads, bazel build). The `push` trigger is
# limited to this workflow file and the build script; enable builds on kernel
# source pushes by adding e.g.
#   paths:
#     - 'drivers/**'
#     - 'arch/**'
#     - 'include/**'

on:
  push:
    branches:
      - lineage-24.0
    paths:
      - '.github/workflows/build-full-kernel.yml'
      - 'ci/build-kernel-platform.sh'
      - 'ci/build-config.env'
  workflow_dispatch:
    inputs:
      target:
        description: 'kleaf target variant'
        required: true
        default: 'canoe_perf'
        type: choice
        options:
          - canoe_perf
          - canoe_consolidate
      common_url:
        description: 'ACK kernel tree (clone URL); any public mirror works'
        required: true
        default: 'https://android.googlesource.com/kernel/common'
        type: string
      common_ref:
        description: 'ACK ref: branch, tag or commit (e.g. android16-6.12-2025-06_r8 = 6.12.23 / KMI 5)'
        required: true
        default: 'android16-6.12-2026-06'
        type: string
      soc_ref:
        description: 'Optional: build a historical SoC repo ref (branch/tag/commit); empty = this checkout'
        required: false
        default: ''
        type: string
      kleaf_ref:
        description: 'kleaf (kernel/build mirror) ref'
        required: true
        default: 'main-kernel-2025'
        type: string
      modules_ref:
        description: 'sm8850-modules ref (branch/tag/commit)'
        required: true
        default: 'lineage-24.0'
        type: string
      devicetrees_ref:
        description: 'sm8850-devicetrees ref (branch/tag/commit)'
        required: true
        default: 'lineage-24.0'
        type: string
      skip_sync:
        description: 'Skip fetching the platform (reuse a previous sync in the same job only)'
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: full-kernel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Resolve configuration
        env:
          IN_TARGET: ${{ github.event.inputs.target }}
          IN_COMMON_URL: ${{ github.event.inputs.common_url }}
          IN_COMMON: ${{ github.event.inputs.common_ref }}
          IN_SOC_REF: ${{ github.event.inputs.soc_ref }}
          IN_KLEAF: ${{ github.event.inputs.kleaf_ref }}
          IN_MODULES: ${{ github.event.inputs.modules_ref }}
          IN_DT: ${{ github.event.inputs.devicetrees_ref }}
        run: |
          # ci/build-config.env holds the defaults; workflow inputs override them.
          set -a
          [ -f ci/build-config.env ] && . ./ci/build-config.env
          set +a
          TARGET="${IN_TARGET:-${TARGET:-canoe_perf}}"
          COMMON_URL="${IN_COMMON_URL:-${COMMON_URL:-https://android.googlesource.com/kernel/common}}"
          COMMON_REF="${IN_COMMON:-${COMMON_REF:-android16-6.12-2026-06}}"
          SOC_REF="${IN_SOC_REF:-${SOC_REF:-}}"
          KLEAF_REF="${IN_KLEAF:-${KLEAF_REF:-main-kernel-2025}}"
          MODULES_REF="${IN_MODULES:-${MODULES_REF:-lineage-24.0}}"
          DEVICETREES_REF="${IN_DT:-${DEVICETREES_REF:-lineage-24.0}}"
          for kv in TARGET COMMON_URL COMMON_REF SOC_REF KLEAF_REF MODULES_REF DEVICETREES_REF; do
            printf '%s=%s\n' "$kv" "${!kv}" >> "$GITHUB_ENV"
          done
          {
            echo "### kernel platform build configuration"
            echo
            echo "| item | value |"
            echo "| --- | --- |"
            echo "| target | \`$TARGET\` |"
            echo "| ACK tree | \`$COMMON_URL\` |"
            echo "| ACK ref | \`$COMMON_REF\` |"
            echo "| SoC ref | \`${SOC_REF:-<this checkout>}\` |"
            echo "| kleaf | \`$KLEAF_REF\` |"
            echo "| modules | \`$MODULES_REF\` |"
            echo "| devicetrees | \`$DEVICETREES_REF\` |"
            echo "| soc repo | \`${GITHUB_REPOSITORY}@${GITHUB_REF_NAME}\` (${GITHUB_SHA:0:12}) |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache \
            /usr/local/share/boost /usr/local/share/powershell /usr/share/swift \
            /opt/az /opt/microsoft /usr/lib/jvm /usr/local/.ghcup || true
          sudo apt-get clean
          df -h
          free -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            bc bison flex libssl-dev libelf-dev libdw-dev cpio xz-utils zip unzip \
            wget curl git python3 rsync dwarves
          echo "--- host tools ---"
          python3 --version
          rsync --version | head -n1

      - name: Build kernel platform
        run: |
          set -o pipefail
          KROOT="$GITHUB_WORKSPACE/kernel-platform" \
          SOC_SRC="$GITHUB_WORKSPACE" \
          TARGET="$TARGET" \
          COMMON_URL="$COMMON_URL" \
          COMMON_REF="$COMMON_REF" \
          SOC_REF="$SOC_REF" \
          KLEAF_REF="$KLEAF_REF" \
          MODULES_REF="$MODULES_REF" \
          DEVICETREES_REF="$DEVICETREES_REF" \
          JOBS="$(nproc --all)" \
          bash ci/build-kernel-platform.sh 2>&1 | tee build-full.log

      - name: Upload kernel artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: OnePlus15-full-kernel-${{ env.TARGET }}
          path: |
            kernel-platform/build-info.txt
            kernel-platform/out/dist/Image
            kernel-platform/out/dist/*.img
            kernel-platform/out/dist/*.ko
            kernel-platform/out/dist/*.dtb
            kernel-platform/out/dist/*.dtbo
            kernel-platform/out/dist/modules.*
          if-no-files-found: warn
          retention-days: 14

      - name: Publish failure log to run summary
        if: failure()
        run: |
          {
            echo "### Full kernel build failed"
            echo
            echo '```text'
            tail -n 300 build-full.log 2>/dev/null || echo "no build-full.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish build status/log to the ci-logs branch
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set +e
          NAME="$(echo "$GITHUB_WORKFLOW" | tr -c 'A-Za-z0-9._-' '_')"
          WORK=$(mktemp -d); cd "$WORK"
          git init -q .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          { git fetch -q --depth=1 origin ci-logs && git checkout -q -B ci-logs FETCH_HEAD; } || git checkout -q -B ci-logs
          mkdir -p logs status
          {
            echo "workflow : ${GITHUB_WORKFLOW}"
            echo "run      : #${GITHUB_RUN_NUMBER} (${GITHUB_RUN_ID})"
            echo "status   : ${JOB_STATUS}"
            echo "commit   : ${GITHUB_SHA}"
            echo "url      : ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            for f in "$GITHUB_WORKSPACE/kernel-platform/build-info.txt" "$GITHUB_WORKSPACE/kernel-workspace/build-info.txt"; do
              [ -f "$f" ] && { echo "--- ${f##*/} ---"; cat "$f"; }
            done
          } > "status/${NAME}.txt"
          for f in "$GITHUB_WORKSPACE/build-full.log" "$GITHUB_WORKSPACE/build.log"; do
            if [ -f "$f" ]; then tail -n 5000 "$f" > "logs/${NAME}-last.log"; break; fi
          done
          git add -A
          git commit -q -m "ci: ${NAME} run #${GITHUB_RUN_NUMBER} ${JOB_STATUS} (${GITHUB_SHA:0:7})"
          git push -q origin ci-logs && echo "published to the ci-logs branch"

      - name: Free disk space report
        if: always()
        run: df -h
