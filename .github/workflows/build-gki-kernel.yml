name: Build GKI kernel (OnePlus 15 OSS 6.12.23 / KMI 5)

# Builds the GKI `Image` from the official OnePlus OSS kernel release
# (OnePlusOSS/android_kernel_common_oneplus_sm8850 @
#  oneplus/sm8850_b_16.0.0_oneplus_15, Linux 6.12.23, KMI generation 5) with the
# aosp LLVM/Clang + rust prebuilts, reproduces the ROM's kernel release string
# so its prebuilt vendor modules keep loading, and packs the result into an
# AnyKernel3 zip (boot only - the ramdisk of this device lives in init_boot).
#
# See README-kernel-build.md for when to use this pipeline instead of the full
# kernel_platform one (ci/build-kernel-platform.sh).

on:
  workflow_dispatch:
    inputs:
      kernel_repo:
        description: 'OnePlus OSS "common" kernel tree (<owner>/<repo>)'
        required: true
        default: 'OnePlusOSS/android_kernel_common_oneplus_sm8850'
        type: string
      kernel_ref:
        description: 'Branch of the OSS tree (16.0.0 oneplus_15 = Linux 6.12.23)'
        required: true
        default: 'oneplus/sm8850_b_16.0.0_oneplus_15'
        type: string
      kernel_suffix:
        description: 'Kernel release suffix that must match the ROM (vermagic)'
        required: true
        default: 'android16-5-gb2a876903b49-ab14541642-4k'
        type: string
      use_ccache:
        description: 'Use ccache (recommended)'
        required: true
        default: true
        type: boolean
  push:
    branches:
      - lineage-24.0
    paths:
      - '.github/workflows/build-gki-kernel.yml'
      - 'ci/build-gki-kernel.sh'
      - 'ci/anykernel.sh'

permissions:
  contents: write

concurrency:
  group: gki-kernel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve configuration
        env:
          IN_REPO: ${{ github.event.inputs.kernel_repo }}
          IN_REF: ${{ github.event.inputs.kernel_ref }}
          IN_SUFFIX: ${{ github.event.inputs.kernel_suffix }}
          IN_CCACHE: ${{ github.event.inputs.use_ccache }}
        run: |
          echo "KERNEL_REPO=${IN_REPO:-OnePlusOSS/android_kernel_common_oneplus_sm8850}" >> "$GITHUB_ENV"
          echo "KERNEL_REF=${IN_REF:-oneplus/sm8850_b_16.0.0_oneplus_15}" >> "$GITHUB_ENV"
          echo "KERNEL_SUFFIX=${IN_SUFFIX:-android16-5-gb2a876903b49-ab14541642-4k}" >> "$GITHUB_ENV"
          if [ -z "${IN_CCACHE}" ]; then IN_CCACHE=true; fi
          echo "USE_CCACHE=$([ "${IN_CCACHE}" = "true" ] && echo 1 || echo 0)" >> "$GITHUB_ENV"
          echo "CCACHE_DIR=$HOME/.ccache-gki" >> "$GITHUB_ENV"
          {
            echo "### GKI build configuration"
            echo
            echo "| item | value |"
            echo "| --- | --- |"
            echo "| OSS tree | \`${IN_REPO:-OnePlusOSS/android_kernel_common_oneplus_sm8850}\` |"
            echo "| ref | \`${IN_REF:-oneplus/sm8850_b_16.0.0_oneplus_15}\` |"
            echo "| release suffix | \`${IN_SUFFIX:-android16-5-gb2a876903b49-ab14541642-4k}\` |"
            echo "| ccache | ${IN_CCACHE:-true} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            bc bison flex libssl-dev libelf-dev libdw-dev cpio xz-utils zip unzip \
            wget curl git python3 dwarves ccache
          make --version | head -n1
          ccache --version | head -n1
          pahole --version || true

      - name: Restore ccache
        if: env.USE_CCACHE == '1'
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-gki-${{ env.KERNEL_REPO }}-${{ env.KERNEL_REF }}-${{ env.KERNEL_SUFFIX }}
          restore-keys: |
            ccache-gki-${{ env.KERNEL_REPO }}-${{ env.KERNEL_REF }}-

      - name: Build GKI kernel
        run: |
          set -o pipefail
          WS="$GITHUB_WORKSPACE/gki-workspace" \
          KERNEL_REPO="$KERNEL_REPO" \
          KERNEL_REF="$KERNEL_REF" \
          KERNEL_SUFFIX="$KERNEL_SUFFIX" \
          USE_CCACHE="$USE_CCACHE" \
          CCACHE_DIR="$CCACHE_DIR" \
          JOBS="$(nproc --all)" \
          bash ci/build-gki-kernel.sh 2>&1 | tee build-gki.log

      - name: ccache statistics
        if: always() && env.USE_CCACHE == '1'
        run: ccache -s || true

      - name: Upload flashable zip and Image
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: OnePlus15-gki-6.12.23
          path: |
            gki-workspace/OSS-OnePlus15-KMI5-gki-*.zip
            gki-workspace/build-info.txt
            gki-workspace/common/out/arch/arm64/boot/Image
            gki-workspace/common/out/.config
          if-no-files-found: error
          retention-days: 14

      - name: Publish failure log to run summary
        if: failure()
        run: |
          {
            echo "### GKI build failed"
            echo
            echo '```text'
            tail -n 250 build-gki.log 2>/dev/null || echo "no build-gki.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish build status/log to the ci-logs branch
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set +e
          NAME="$(echo "$GITHUB_WORKFLOW" | tr -c 'A-Za-z0-9._-' '_')"
          WORK=$(mktemp -d); cd "$WORK"
          git init -q .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          { git fetch -q --depth=1 origin ci-logs && git checkout -q -B ci-logs FETCH_HEAD; } || git checkout -q -B ci-logs
          mkdir -p logs status
          {
            echo "workflow : ${GITHUB_WORKFLOW}"
            echo "run      : #${GITHUB_RUN_NUMBER} (${GITHUB_RUN_ID})"
            echo "status   : ${JOB_STATUS}"
            echo "commit   : ${GITHUB_SHA}"
            echo "url      : ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            [ -f "$GITHUB_WORKSPACE/gki-workspace/build-info.txt" ] && cat "$GITHUB_WORKSPACE/gki-workspace/build-info.txt"
          } > "status/${NAME}.txt"
          [ -f "$GITHUB_WORKSPACE/build-gki.log" ] && tail -n 5000 "$GITHUB_WORKSPACE/build-gki.log" > "logs/${NAME}-last.log"
          git add -A
          git commit -q -m "ci: ${NAME} run #${GITHUB_RUN_NUMBER} ${JOB_STATUS} (${GITHUB_SHA:0:7})"
          git push -q origin ci-logs && echo "published to the ci-logs branch"
